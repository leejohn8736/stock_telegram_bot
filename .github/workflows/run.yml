name: Stock Alert Bot

on:
  schedule:
    - cron: "40 7 * * 1-5"
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "KR / US / ALL"
        default: "ALL"

permissions:
  contents: write

concurrency:
  group: stock-alert-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick market
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            M="${{ github.event.inputs.market }}"
          elif [ "${{ github.event.schedule }}" = "40 7 * * 1-5" ]; then
            M="KR"
          else
            M="US"
          fi
          [ "$M" = "ALL" ] && M="KR US"
          echo "markets=$M" >> "$GITHUB_OUTPUT"
      - name: Run signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bnf_signal.py ${{ steps.m.outputs.markets }}
      - name: Commit results
        run: |
          git config user.name "bot-runner"
          git config user.email "bot-runner@users.noreply.github.com"
          git add docs/data state
          git diff --cached --quiet || git commit -m "signal update $(date -u +%F)"
          git pull --rebase && git push
