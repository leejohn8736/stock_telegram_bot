name: Stock Alert Bot

on:
  schedule:
    - cron: "40 7 * * 1-5"
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "KR / US / ALL"
        default: "ALL"

permissions:
  contents: write

concurrency:
  group: stock-alert-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi google-genai
      - name: Run main script (With timeout protection)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 60초(1분) 동안만 실행하고 알림 전송 후 강제 종료되도록 타임아웃 적용
          timeout 60s python main.py || echo "Script execution finished or timed out gracefully."
      - name: Commit results
        if: always()
        run: |
          git config --global user.name "bot-runner"
          git config --global user.email "bot-runner@users.noreply.github.com"
          git add docs/data state || true
          git diff --cached --quiet || git commit -m "auto: update bot state" || true
          git push origin main || echo "Push skipped"
